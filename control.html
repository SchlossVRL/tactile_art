<!DOCTYPE html>
<html>

<head>
    <title>Experimenter Controls</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
        }

        /*.container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 100vh;
        }*/

        .page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .instruction {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 25px;
        }

        .container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex: 1;
            width: 100%;
        }

        .option {
            text-align: center;
            /* centers label above image */
        }

        .option-label {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }

        img {
            width: 300px;
            cursor: pointer;
        }

        img:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="page-container">
        <!-- Shared instruction above both images -->
        <div class="instruction">
            Experimenter: "You may now touch the texture paintings."
        </div>
        <div class="container">
            <div class="option">
                <p class="option-label">Left</p>
                <img id="left" onclick="sendResponse('left')">
            </div>
            <div class="option">
                <p class="option-label">Right</p>
                <img id="right" onclick="sendResponse('right')">
            </div>
        </div>
    </div>
    <script>
        /* ------------------------------
           Receive trial updates
        ------------------------------ */

        window.addEventListener("message", (event) => {
            if (event.data.type === "update_trial") {
                document.getElementById("left").src = event.data.left_img;
                document.getElementById("right").src = event.data.right_img;
            }
        });

        /* ------------------------------
           Send responses
        ------------------------------ */
        function sendResponse(direction) {
            window.opener.postMessage(
                { type: "response", value: direction },
                "*"
            );
        }
    </script>
</body>

</html>

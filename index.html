<!DOCTYPE html>
<html>

<head>
    <title>Participant View</title>

    <script src="jsPsych/jspsych.js"></script>
    <script src="jsPsych/plugin-html-keyboard-response.js"></script>
    <script src="jsPsych/plugin-fullscreen.js"></script>
    <script src="jsPsych/plugin-preload.js"></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>

    <link href="jsPsych/jspsych.css" rel="stylesheet" />

    <style>
        body {
            background-color: black;
        }

        img {
            max-width: 80vw;
            max-height: 80vh;
        }
    </style>
</head>

<body></body>

<script>

    async function createExperiment() {
        /* ------------------------------
           Initialize jsPsych
        ------------------------------ */
        const jsPsych = initJsPsych({
        });

        const subject_id = jsPsych.randomization.randomID(10);
        const filename = `${subject_id}.csv`;

        // Prompt for participant ID
        var participant_id = prompt("Please enter the participant ID:");

        // Ensure input is valid
        if (!participant_id || isNaN(participant_id)) {
            alert("Invalid participant ID! Please reload the page and enter a numeric ID.");
            throw new Error("Invalid participant ID.");
        }

        // Add it to every trial's data
        jsPsych.data.addProperties({
            subject_id: subject_id,
            participant_id: participant_id
        });

        // Set background color to gray
        document.body.style.backgroundColor = "rgb(128,128,128)";
        //document.body.style.backgroundColor = "rgb(90,90,90)";


        /* ------------------------------
          Inter trial interval 
       ------------------------------ */
        const iti = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: ``,  ///<div style="font-size:48px">+</div>
            choices: "NO_KEYS",
            trial_duration: 500
        };

        function withITI(trials, iti) {
            return trials.flatMap(t => [iti, t]);
        }

        /* ------------------------------
           Stimulus triplets
        ------------------------------ */
        const trial_sets = [
            {
                id: 1,
                participant_img: "images/C1.png",
                A_img: "images/1A.png",
                B_img: "images/1B.png"
            },
            {
                id: 2,
                participant_img: "images/C2.png",
                A_img: "images/2A.png",
                B_img: "images/2B.png"
            },
            {
                id: 3,
                participant_img: "images/C3.png",
                A_img: "images/3A.png",
                B_img: "images/3B.png"
            },
            {
                id: 4,
                participant_img: "images/C4.png",
                A_img: "images/4A.png",
                B_img: "images/4B.png"
            },
            {
                id: 5,
                participant_img: "images/C5.png",
                A_img: "images/5A.png",
                B_img: "images/5B.png"
            },
            {
                id: 6,
                participant_img: "images/C6.png",
                A_img: "images/6A.png",
                B_img: "images/6B.png"
            },
            {
                id: 7,
                participant_img: "images/C7.png",
                A_img: "images/7A.png",
                B_img: "images/7B.png"
            },
            {
                id: 8,
                participant_img: "images/C8.png",
                A_img: "images/8A.png",
                B_img: "images/8B.png"
            },
            {
                id: 9,
                participant_img: "images/C9.png",
                A_img: "images/9A.png",
                B_img: "images/9B.png"
            }
        ];

        /* ------------------------------
           Breaks
        ------------------------------ */

        function makeBreakTrial({ id, stimulus, left_img, right_img }) {
            return {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: stimulus,
                choices: "NO_KEYS",

                data: {
                    trial_id: id,
                    trial_type: "break",
                    participant_img: stimulus,
                    left_img: left_img,
                    right_img: right_img
                },

                on_load: () => {
                    controlWindow.postMessage({
                        type: "update_trial",
                        left_img: left_img,
                        right_img: right_img
                    }, "*");
                }
            };
        }

        const break1 = makeBreakTrial({
            id: 501,
            stimulus: `<div style="font-size: 36px; line-height: 1.5; color: black;">
                You have completed block 1 of 4. You may take a short break before continuing the experiment.
            </div>`,
            left_img: "images/break_1.png",
            right_img: "images/continue.png"
        });

        const break2 = makeBreakTrial({
            id: 502,
            stimulus: `<div style="font-size: 36px; line-height: 1.5; color: black;">
                You have completed block 2 of 4. You may take a short break before continuing the experiment.
            </div>`,
            left_img: "images/break_2.png",
            right_img: "images/continue.png"
        });

        const break3 = makeBreakTrial({
            id: 503,
            stimulus: `<div style="font-size: 36px; line-height: 1.5; color: black;">
                You have completed block 3 of 4. You may take a short break before continuing the experiment.
            </div>`,
            left_img: "images/break_3.png",
            right_img: "images/continue.png"
        });

        /* ------------------------------
           End
        ------------------------------ */

        const end = makeBreakTrial({
            id: 1002,
            stimulus: `<div style="font-size: 36px; line-height: 1.5; color: black;">
                Thank you for your participation, you have completed the experimental trials. 
                <br><br> You may now remove your headphones so the experimenter can provide next steps.
            </div>`,
            left_img: "images/end_note.png",
            right_img: "images/end.png"
        });

        const thank_you = makeBreakTrial({
            id: 1003,
            stimulus: `<div style="font-size: 36px; line-height: 1.5; color: black;">
                Data file saved. Thank you!
            </div>`,
            left_img: "images/end.png",
            right_img: "images/end.png"
        });

        /*const end_control = [
            {
                id: 1000,
                participant_img: `<div style="font-size: 48px; color: black;"> Thank you for your participation, you have completed the experimental trials. 
                <br><br><br> You may now remove your headphones so the experimenter can provide next steps.`,
                left_img: "images/end.png",
                right_img: "images/end.png"
            }
        ];*/
        /* ------------------------------
           Randomize trial order and sides
        ------------------------------ */

        // Create four blocks

        const blocks = [];

        for (let block = 1; block <= 4; block++) {
            // Randomize trial order
            const randomized_sets = jsPsych.randomization.shuffle(trial_sets);
            const block_trials = randomized_sets.map(t => ({
                ...t,
                block: block
            }));
            blocks.push(block_trials);
        }

        // Balance A/B sides across three blocks

        trial_sets.forEach(t => {

            // Each painting gets A on the left twice and right once
            const side_assignments = jsPsych.randomization.shuffle([
                "left", "left", "right", "right"
            ]);

            blocks.forEach((block, index) => {
                const trial = block.find(bt => bt.id === t.id);
                trial.exp_side = side_assignments[index];
                trial.left_img = trial.exp_side === "left" ? t.A_img : t.B_img;
                trial.right_img = trial.exp_side === "left" ? t.B_img : t.A_img;
            });
        });



        // Check side balance
        trial_sets.forEach(t => {
            const sides = blocks.map(block =>
                block.find(bt => bt.id === t.id).exp_side
            );
            console.log(
                `Painting ${t.id}:`,
                sides,
                `Left: ${sides.filter(s => s === "left").length}`,
                `Right: ${sides.filter(s => s === "right").length}`
            );
        });



        /* ------------------------------
           Open experimenter window
        ------------------------------ */
        let controlWindow = null;

        const openControlWindow = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: "<p>Press SPACE to open the control window.</p>",
            choices: [" "],
            on_finish: () => {
                controlWindow = window.open(
                    "control.html",
                    "experimenter_controls",
                    "width=500,height=300"
                );
            }
        };

        /* ------------------------------
           Listen for experimenter responses
        ------------------------------ */
        window.addEventListener("message", (event) => {
            if (event.data.type === "response") {
                jsPsych.finishTrial({
                    response: event.data.value
                });
            }
        });

        /* ------------------------------
        Build jsPsych trials
        ------------------------------ */
        function buildTrials(block) {
            return block.map(t => ({
                type: jsPsychHtmlKeyboardResponse,
                stimulus: `<img src="${t.participant_img}" style="max-width:512px; max-height:512px;">`,
                choices: "NO_KEYS",
                data: {
                    trial_id: t.id,
                    block: t.block,
                    participant_img: t.participant_img,
                    left_img: t.left_img,
                    right_img: t.right_img,
                    exp_side: t.exp_side
                },
                on_load: () => {
                    controlWindow.postMessage({
                        type: "update_trial",
                        left_img: t.left_img,
                        right_img: t.right_img
                    }, "*");
                }
            }));
        }

        // Build three blocks
        const trials1 = buildTrials(blocks[0]);
        const trials2 = buildTrials(blocks[1]);
        const trials3 = buildTrials(blocks[2]);
        const trials4 = buildTrials(blocks[3]);

        /* ------------------------------
           End trial
        ------------------------------ */

        /*const end_trial = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `${end_control.participant_img}`,
            choices: "NO_KEYS",

            data: {
                trial_id: end_control.id,
                participant_img: end_control.participant_img,
                left_img: end_control.left_img,
                right_img: end_control.right_img
            },

            on_load: () => {
                // Update experimenter window for this trial
                controlWindow.postMessage({
                    type: "update_trial",
                    left_img: end_control.left_img,
                    right_img: end_control.right_img
                }, "*");
            }
        };*/

        /* ------------------------------
           Preload images
        ------------------------------ */
        const preload = {
            type: jsPsychPreload,
            images: trial_sets.flatMap(t => [
                t.participant_img,
                t.A_img,
                t.B_img
            ])
        };

        /* ------------------------------
           Instructions
        ------------------------------ */
        const get_started = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
            <p>Press SPACE to begin the experiment.</p>
        `,
            choices: [" "]
        };

        /* ------------------------------
           Instructions
        ------------------------------ */

        const instructions = makeBreakTrial({
            id: 1000,
            stimulus: `<div style="text-align: left; font-size: 24px; line-height: 1;">
            <h2>Instructions</h2>
            
            <p>During this experiment you will be presented with a series of trials, each containing one color painting displayed on the screen in front of you, and two texture paintings to touch, one in each of the boxes on either side of the screen. Your task will be to touch the two texture paintings and determine which one best matches the color painting on the screen.</p>
            <p>At the start of each trial, I will place a texture painting in each of the two boxes in front of you, one in the box to your right and one in the box to your left. The boxes have curtains so that you won’t be able to see the textures.</p>
            </div>`,
            choices: "NO_KEYS",
            left_img: "images/practiceA.png",
            right_img: "images/practiceB.png"
        });

        const welcome = makeBreakTrial({
            id: 1000,
            stimulus: `<div>
            <h2>Welcome!</h2></div>`,
            choices: "NO_KEYS",
            left_img: "images/welcome.png",
            right_img: "images/continue.png"
        });

        const example = makeBreakTrial({
            id: 1001,
            stimulus: `<img src="images/C_practice.png" style="max-width:512px; max-height:512px;">`,
            choices: "NO_KEYS",
            left_img: "images/practiceA.png",
            right_img: "images/practiceB.png"
        });

        const begin = makeBreakTrial({
            id: 1000,
            stimulus: `<div style="text-align: left; font-size: 24px; line-height: 1;">
            <p>Great! We are now ready to begin the experimental trials. There are 4 blocks of trials that will take about 30 minutes to complete. I will notify you when you have completed each block.</p>
            <p>Do you have any questions?</p>
            </div>`,
            choices: "NO_KEYS",
            left_img: "images/get_ready.png",
            right_img: "images/begin.png"
        });




        /* ------------------------------
           Debrief
        ------------------------------ */
        /*const debrief = {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `
            
            <p>Thank you for participating in this experiment...</p>
        `,
            choices: [" "]
        };*/

        /* ------------------------------
           Save Data
        ------------------------------ */
        const save_data = {
            type: jsPsychPipe,
            action: "save",
            //experiment_id: "IMErtV4pGj6m",
            experiment_id: "4sVV4MJs6b7m",
            filename: filename,
            data_string: () => jsPsych.data.get().csv()
        };



        /* ------------------------------
           Timeline
        ------------------------------ */
        const timeline = [
            preload,
            get_started,
            openControlWindow,
            {
                type: jsPsychFullscreen,
                fullscreen_mode: true
            },
            welcome,
            example,
            begin,
            // Block 1
            ...withITI(trials1, iti),
            break1,

            // Block 2
            ...withITI(trials2, iti),
            break2,

            // Block 3
            ...withITI(trials3, iti),
            break3,

            // Block 4
            ...withITI(trials4, iti),

            end,
            save_data,
            thank_you
        ];

        jsPsych.run(timeline);
    }

    createExperiment();
</script>

</html>
